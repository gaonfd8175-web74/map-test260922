<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<!-- 앱 화면에 맞추기 위한 모바일 Viewport 설정 추가 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>국가공간정보포털 지적도 비교</title>

<!-- 로컬 경로 대신 온라인 CDN 사용 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/4.6.5/ol.css" type="text/css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/4.6.5/ol.js"></script>
<script src="https://code.jquery.com/jquery-2.2.3.min.js"></script>

<style>
	/* 모바일/앱 환경에 맞춘 스타일 최적화 */
	body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
	#map { width: 100%; height: 75vh; } /* 화면의 75%를 지도로 사용 */
	.controls { padding: 15px; height: 25vh; background: #fff; box-sizing: border-box; }
	.control-group { margin-bottom: 10px; }
	label { display: inline-block; width: 150px; font-weight: bold; font-size: 14px;}
	input[type=range] { width: calc(100% - 160px); vertical-align: middle; }
</style>
</head>

<body>
<div id="map"></div>
<div class="controls">
	<div class="control-group">
		<label>연속 지적도 투명도</label>
		<input id="vworld" type="range" min="0" max="1" step="0.1" value="1">
	</div>
	<div class="control-group">
		<label>편집 지적도 투명도</label>
		<input id="nsdi" type="range" min="0" max="1" step="0.1" value="1">
	</div>
</div>

<script type="text/javascript">
	// HTTP를 HTTPS로 변경 (앱 내 차단 방지)
	var Base = new ol.layer.Tile({
		name : "Base",
		source: new ol.source.XYZ({
			url: 'https://api.vworld.kr/req/wmts/1.0.0/CEB52025-E065-364C-9DBA-44880E3B02B8/Satellite/{z}/{y}/{x}.jpeg'
		})
	}); 
  
    var olView = new ol.View({
        center: [14313669.402732708, 4284759.829065146],
        zoom: 17
    });
	
    var map = new ol.Map({
        layers: [Base],
        target: 'map',
        view: olView
    });
	
	var wms_title = '지적도';
	var wms_val = 'lp_pa_cbnd_bubun,lp_pa_cbnd_bonbun';
	
	var wms_tile = new ol.layer.Tile({
		name : "WMS_LAYER",
		source : new ol.source.TileWMS({
			url : "https://api.vworld.kr/req/wms?", // HTTPS 변경
			params : {
				LAYERS : wms_val,
				STYLES : wms_val,
				CRS : "EPSG:900913",
				apikey : "CEB52025-E065-364C-9DBA-44880E3B02B8",
				DOMAIN : location.origin, // 동적 도메인 할당으로 변경
				title : wms_title,
				FORMAT : "image/png"
			}
		})
	});
	map.addLayer(wms_tile);
	
	var nsdi_tile = new ol.layer.Tile({
		name : "NSDI_LAYER",
		source : new ol.source.TileWMS({
			url : "https://openapi.nsdi.go.kr/nsdi/map/LandInfoBaseMapUTMKBlueService?", // HTTPS 변경
			params : {
				authkey : "aed1f1084e775267d81d20",
				SERVICE : "WMS",
				VERSION : "1.3.0",
				REQUEST : "GetMap",
				FORMAT  : "image/png",
				TRANSPARENT : "TRUE",
				LAYERS : "0",
				CRS : "EPSG:3857",
				STYLES : ""
			}
		})
	});
	map.addLayer(nsdi_tile);
	
	var kop = document.getElementById('vworld');
	var mop = document.getElementById('nsdi');

	kop.addEventListener('input', function() {
        map.getLayers().forEach(function(layer){ 
			if(layer.get("name")=="WMS_LAYER"){
				layer.setOpacity(kop.value)
			}
        });
	});

	mop.addEventListener('input', function() {
        map.getLayers().forEach(function(layer){ 
			if(layer.get("name")=="NSDI_LAYER"){
				layer.setOpacity(mop.value)
			}
        });
	});
</script>
</body>
</html>
